name: Imagem e deploy

# Uma imagem só (API + app do cliente + painel + landing) publicada no GHCR.
# Em push na main, a Application do Dokploy é avisada pelo webhook e puxa a
# tag main. Pull request só builda, para pegar erro antes do merge.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'brand/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'brand/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/automagroup-labs/barber-saas

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref == 'refs/heads/main' && 'main' || 'candidate' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Avisar o Dokploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "Secret DOKPLOY_WEBHOOK_URL não definido; imagem publicada sem deploy."
            exit 0
          fi
          status=$(curl -s -o /tmp/resposta -w '%{http_code}' -X POST "$DOKPLOY_WEBHOOK_URL")
          echo "Dokploy respondeu $status"
          cat /tmp/resposta; echo
          test "$status" -lt 300
