name: Validação

on:
  push:
    branches: [main]
  pull_request:

# A publicação é feita manualmente com Docker Compose. Esta ação apenas valida
# o projeto e não publica imagens nem exige secrets de servidor.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validar build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: sua-barbearia:validacao
      - name: Validar compose de deploy
        run: |
          cp deploy/.env.docker.example deploy/.env.docker
          docker compose --env-file deploy/.env.docker -f deploy/docker-compose.yml config
