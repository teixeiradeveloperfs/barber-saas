# Três sites estáticos (SPA), um por porta. O Traefik do Dokploy cuida de host e HTTPS.
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types {
    application/manifest+json webmanifest;
  }
  sendfile on;
  server_tokens off;
  access_log off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Arquivos com hash no nome ficam para sempre; o resto (index.html, sw.js, manifest) revalida.
  map $uri $cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
  }

  # App do cliente da instalação única.
  server {
    listen 7693 default_server;
    root /srv/app;
    index index.html;
    location / {
      add_header Cache-Control $cache_control;
      try_files $uri $uri/ /index.html;
    }

    # Manifesto e ícones vêm da API da instalação única.
    location = /manifest.webmanifest {
      proxy_pass http://127.0.0.1:7192/public/manifest.webmanifest;
      proxy_intercept_errors on;
      error_page 404 500 502 503 504 = /manifest.default.webmanifest;
    }

    location /app-icon/ {
      proxy_pass http://127.0.0.1:7192/public/app-icon/;
      proxy_intercept_errors on;
      error_page 404 500 502 503 504 = /icons/icon-512.png;
    }

    location = /apple-touch-icon.png {
      proxy_pass http://127.0.0.1:7192/public/app-icon/apple-touch-icon.png;
      proxy_intercept_errors on;
      error_page 404 500 502 503 504 = /icons/apple-touch-icon.png;
    }
  }

  # Painel
  server {
    listen 5928 default_server;
    root /srv/admin;
    index index.html;
    location / {
      add_header Cache-Control $cache_control;
      add_header X-Robots-Tag "noindex, nofollow";
      try_files $uri $uri/ /index.html;
    }
  }

  # Landing
  server {
    listen 6400 default_server;
    root /srv/landing;
    index index.html;
    location / {
      add_header Cache-Control $cache_control;
      try_files $uri $uri/ /index.html;
    }
  }
}
