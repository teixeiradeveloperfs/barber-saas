# Borda pública (168.195.14.106) → Traefik do Dokploy, para o BarberOS.
# Vai em /etc/nginx/sites-available/barberosbr.com (+ link em sites-enabled),
# depois: nginx -t && systemctl reload nginx
#
# Destino: o mesmo Traefik para onde vão os blocos dos plinkos. Confira no
# bloco do plinkotesouro.top; 10.116.249.223 é o endereço do nó do Dokploy.
#
# Certificado: Cloudflare > barberosbr.com > SSL/TLS > Origin Server > Create
# certificate para "barberosbr.com". Modo SSL/TLS da zona:
# Full (strict).
#
# A instalação usa apenas os domínios oficiais do BarberOS.

upstream barberos_traefik_https {
    server 10.116.249.223:443;
    keepalive 32;
}

upstream barberos_traefik_http {
    server 10.116.249.223:80;
}

# HTTP: o desafio do Let's Encrypt vai para o Traefik; o resto vira HTTPS.
server {
    listen 80;
    server_name barberosbr.com www.barberosbr.com admin.barberosbr.com api.barberosbr.com;

    location /.well-known/acme-challenge/ {
        proxy_pass http://barberos_traefik_http;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: landing, painel, API e o app da instalação.
server {
    listen 443 ssl;
    http2 on;
    server_name barberosbr.com www.barberosbr.com admin.barberosbr.com api.barberosbr.com;

    ssl_certificate     /etc/nginx/ssl/barberosbr.com/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/barberosbr.com/origin.key;

    # Banco de imagens aceita arquivos de até 8 MB.
    client_max_body_size 10m;

    location / {
        proxy_pass https://barberos_traefik_https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # SNI e Host da requisição original: o Traefik roteia por eles.
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
