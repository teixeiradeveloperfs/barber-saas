<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0c" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3efe6" />
    <meta name="robots" content="noindex" />
    <meta name="application-name" content="Sua Barbearia" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Sua Barbearia</title>
    <script>
      try {
        var theme = localStorage.getItem('barber-admin:theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
